[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layercake-spike"
version = "0.1.0"
description = "Layercake (Project POP): product model plus the Spike 01 and Spike 02 experiments"
requires-python = ">=3.11"
dependencies = [
    "pyclipr>=0.1.8",
    "trimesh>=4.6",
    "shapely>=2.0",
    "mapbox-earcut>=1.0",
    "numpy>=1.26",
    "manifold3d>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
layercake-spike = "layercake_spike.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
